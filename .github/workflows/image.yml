name: Image

# Builds the Sentry Six Manager Docker image and publishes it to GitHub's
# registry, ghcr.io/<owner>/<repo>, for amd64 and arm64.
#   - Every image gets a build number: this workflow's run number, which
#     only ever goes up (runs that published nothing leave gaps). The app
#     shows it as "Build N"; it is in /app/BUILD_INFO.json and the label
#     org.opencontainers.image.version=build-N, which Settings > Updates
#     reads to tell how many builds behind a server is.
#   - A push to main publishes `latest`, `build-N` and `sha-<commit>` (pin a
#     `build-` or `sha-` tag with SENTRY_TAG to stay on, or go back to, a
#     version).
#   - Running it by hand for another branch (Actions > Image > Run workflow)
#     publishes an image tagged with that branch's name and `sha-<commit>`
#     (no `build-N` tag: those are only for releases from main).
#   - Nothing is built on a timer: a new image only ever comes from a push
#     to main or a run by hand, so an "update available" always means the
#     owner released something. Each build fetches the latest Debian, Node
#     and ffmpeg packages (the package step is not reused from an older
#     week's build cache).
# The tests (in three parts) and the two images (each on its own kind of
# machine, no emulation) run at the same time. The images are pushed only by
# digest, which nobody pulls; the tag that people pull is put on them last,
# and only when every test passed and both images started, answered, had
# their encoders and ran the app unprivileged.
# New packages are private: make it public once under the owner's
# Packages > <repo> > Package settings so anyone can pull it.

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'truenas/**']
  workflow_dispatch:

# Read-only by default; only the jobs that push images may write packages.
permissions:
  contents: read

# A newer push replaces a build still running for an older one.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.names.outputs.image }}
      tag: ${{ steps.names.outputs.tag }}
      branch: ${{ steps.names.outputs.branch }}
      sha: ${{ steps.names.outputs.sha }}
      short: ${{ steps.names.outputs.short }}
      created: ${{ steps.names.outputs.created }}
      build: ${{ steps.names.outputs.build }}
      week: ${{ steps.names.outputs.week }}
      critical: ${{ steps.critical.outputs.critical }}
      critical_level: ${{ steps.critical.outputs.critical_level }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Image name and tag
        id: names
        run: |
          branch="$GITHUB_REF_NAME"
          if [ "$branch" = main ]; then tag=latest; else tag="${branch//[^A-Za-z0-9_.-]/-}"; tag="${tag#[.-]}"; fi
          sha="$(git rev-parse HEAD)"
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "tag=${tag:0:120}"
            echo "branch=$branch"
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "build=$GITHUB_RUN_NUMBER"
            echo "week=$(date -u +%G-W%V)"
          } >> "$GITHUB_OUTPUT"
      # CRITICAL_UPDATE.txt: `level: N` and `reason: text`. Every image
      # carries the last critical release's level and reason (sticky, so
      # servers that skip releases still see it). Only ever data: a whole
      # number, and one line without quotes, backslashes or control
      # characters, commas made semicolons (the labels list splits on
      # them), at most 300 characters.
      - name: Critical update flag
        id: critical
        run: |
          level=0
          reason=""
          if [ -f CRITICAL_UPDATE.txt ]; then
            level="$({ grep -iE '^[[:space:]]*level:' CRITICAL_UPDATE.txt || true; } | tail -n 1 | sed -E 's/^[^:]*://; s/^[[:space:]]+//; s/[[:space:]]+$//' | tr -d '\r')"
            reason="$({ grep -iE '^[[:space:]]*reason:' CRITICAL_UPDATE.txt || true; } | tail -n 1 | sed -E 's/^[^:]*://' | tr '\t\r\n' '   ' | tr -d '\000-\037\177"`\\'"'" | tr ',' ';' | tr -s ' ' | sed 's/^ *//; s/ *$//')"
          fi
          [[ "$level" =~ ^[0-9]{1,6}$ ]] || level=0
          level=$((10#$level))
          reason="${reason:0:300}"
          reason="${reason% }"
          if [ -z "$reason" ]; then level=0; fi
          if [ "$level" -eq 0 ]; then reason=""; fi
          if [ "$level" -gt 0 ]; then echo "::notice::Images carry critical level $level: $reason"; fi
          echo "critical_level=$level" >> "$GITHUB_OUTPUT"
          echo "critical=$reason" >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    steps:
      # (the tests never see a token)
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # The ffmpeg packages the tests need (63 MB) are kept between runs: the
      # Ubuntu mirror once took 21 minutes to send them.
      - name: Cache ffmpeg packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ runner.os }}-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: apt-ffmpeg-${{ runner.os }}-

      - name: Tests (part ${{ matrix.shard }} of 3)
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" ffmpeg
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          mkdir -p build && gcc -O2 -Wall -o build/noreplace-rename native/noreplace-rename.c
          node --disable-warning=ExperimentalWarning --test --test-shard=${{ matrix.shard }}/3 "test/**/*.test.js"

  build:
    needs: names
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            encoders: libx265 libsvtav1 hevc_nvenc av1_nvenc hevc_vaapi av1_vaapi hevc_qsv av1_qsv
          - arch: arm64
            runner: ubuntu-24.04-arm
            encoders: libx265 libsvtav1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4

      - name: Build for checking (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: sentry-six-manager:check
          build-args: |
            GIT_SHA=${{ needs.names.outputs.sha }}
            GIT_BRANCH=${{ needs.names.outputs.branch }}
            BUILD_DATE=${{ needs.names.outputs.created }}
            IMAGE=${{ needs.names.outputs.image }}
            IMAGE_TAG=${{ needs.names.outputs.tag }}
            BUILD_NUMBER=${{ needs.names.outputs.build }}
            APT_REFRESH=${{ needs.names.outputs.week }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Check the image
        run: |
          docker run -d --name check -p 127.0.0.1:9000:9000 --cap-drop ALL \
            --cap-add SYS_ADMIN --cap-add DAC_READ_SEARCH --cap-add DAC_OVERRIDE --cap-add SETUID \
            --cap-add SETGID --cap-add SETPCAP --cap-add CHOWN --cap-add KILL \
            --security-opt no-new-privileges:true -e UI_PASSWORD=check-the-image sentry-six-manager:check
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:9000/healthz >/dev/null && break; sleep 2; done
          docker logs check 2>&1 | tail -20
          curl -fsk -o /dev/null https://127.0.0.1:9000/login
          docker exec check ffmpeg -hide_banner -version | head -1
          docker exec check ffmpeg -hide_banner -encoders > encoders.txt
          for e in ${{ matrix.encoders }}; do
            grep -q " $e " encoders.txt || { echo "::error::ffmpeg has no $e encoder"; exit 1; }
          done
          # the web app: uid 1000, no capabilities, no_new_privs
          # (only node processes: this checking shell's own command line names the file too)
          docker exec check sh -c 'for p in /proc/[0-9]*; do tr "\0" " " < $p/cmdline 2>/dev/null | grep -qE "^[^ ]*node .*server/index\.js" && grep -E "^(Uid|CapEff|NoNewPrivs):" $p/status; done; true' | tee app.txt
          test "$(grep -c '^Uid:' app.txt)" -eq 1
          grep -Eq '^Uid:\s+1000\s' app.txt && grep -Eq '^CapEff:\s+0+$' app.txt && grep -Eq '^NoNewPrivs:\s+1$' app.txt
          docker rm -f check

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only (no tag), from the build cache of the check above
      - name: Push by digest (${{ matrix.arch }})
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=Sentry Six Manager
            org.opencontainers.image.description=Sentry Studio's viewer and converter as a self-hosted web app, with footage management for a TeslaCam archive
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.names.outputs.sha }}
            org.opencontainers.image.created=${{ needs.names.outputs.created }}
            org.opencontainers.image.version=build-${{ needs.names.outputs.build }}
            ${{ needs.names.outputs.critical != '' && format('io.sentry-six.critical={0}', needs.names.outputs.critical) || '' }}
            ${{ needs.names.outputs.critical != '' && format('io.sentry-six.critical-level={0}', needs.names.outputs.critical_level) || '' }}
          build-args: |
            GIT_SHA=${{ needs.names.outputs.sha }}
            GIT_BRANCH=${{ needs.names.outputs.branch }}
            BUILD_DATE=${{ needs.names.outputs.created }}
            IMAGE=${{ needs.names.outputs.image }}
            IMAGE_TAG=${{ needs.names.outputs.tag }}
            BUILD_NUMBER=${{ needs.names.outputs.build }}
            APT_REFRESH=${{ needs.names.outputs.week }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Keep the digest
        run: |
          mkdir -p digests
          digest="${{ steps.push.outputs.digest }}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest"; exit 1; }
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [names, tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both images (amd64, arm64)
        working-directory: digests
        run: |
          image="${{ needs.names.outputs.image }}"
          test "$(ls | wc -l)" -eq 2
          tags=(-t "$image:${{ needs.names.outputs.tag }}" -t "$image:sha-${{ needs.names.outputs.short }}")
          # build-N only for a release (main): a branch run by hand is not one
          if [ "${{ needs.names.outputs.tag }}" = latest ]; then tags+=(-t "$image:build-${{ needs.names.outputs.build }}"); fi
          docker buildx imagetools create "${tags[@]}" $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:${{ needs.names.outputs.tag }}"
