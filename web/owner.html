<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Owner · Sentry Six Manager demo</title>
  <link rel="icon" type="image/png" href="/web/icon.png">
  <link rel="stylesheet" href="/web/shell.css">
  <style>
    body { padding: 24px 16px 48px; }
    .wrap { max-width: 1100px; margin: 0 auto; }
    .login { width: min(400px, 100%); margin: 12vh auto 0; }
    .login form { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
    .err { color: var(--danger); min-height: 20px; font-size: 13.5px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
    .tile b { display: block; font-size: 24px; font-weight: 700; }
    .tile span { color: var(--muted); font-size: 12.5px; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
    .bar .input { width: auto; min-height: 38px; }
    .card { padding: 18px; }
    .group-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
    .group-head .addr { font-family: var(--mono); font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
    .kinds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .entries { margin-top: 12px; font-size: 13px; }
    .entries td.sample, .entries td.agent { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
    .info { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .info .card { margin: 0; }
    .kv { grid-template-columns: 120px minmax(0, 1fr); }
    @media (max-width: 640px) {
      .entries thead { display: none; }
      .entries tr { display: block; border-bottom: 1px solid var(--border); padding: 8px 0; }
      .entries td { display: block; border: 0; padding: 2px 0; }
      .entries td[data-l]::before { content: attr(data-l) ': '; color: var(--muted); font-family: var(--font); }
      .kv { grid-template-columns: 100px minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card login" id="login" hidden>
      <h2>Demo owner</h2>
      <p class="muted small" style="margin-top:6px">This page opens only from the local network.</p>
      <form id="login-form">
        <label class="field">Owner password<input class="input" name="password" type="password" autocomplete="current-password" required></label>
        <p class="err" id="login-err" role="alert"></p>
        <button class="btn solid" type="submit">Open</button>
      </form>
    </section>
    <section id="page" hidden>
      <div class="top">
        <div><h1>Attack log</h1><p class="muted small" id="you"></p></div>
        <button class="btn sm ghost" id="logout" type="button">Close</button>
      </div>
      <div class="tiles" id="tiles"></div>
      <div class="info">
        <div class="card"><h3>Demo</h3><dl class="kv" style="margin-top:12px" id="demo"></dl><div style="margin-top:14px"><button class="btn sm danger" id="reset" type="button">Reset now</button> <span class="muted small" id="reset-note"></span></div></div>
        <div class="card"><h3>Certificate</h3><dl class="kv" style="margin-top:12px" id="cert"></dl></div>
      </div>
      <div class="bar">
        <select class="input" id="kind" aria-label="Kind">
          <option value="">Every kind</option>
          <option value="login">Failed sign-ins</option>
          <option value="owner-probe">Owner page probes</option>
          <option value="scan">Scanner paths</option>
          <option value="exploit">Exploit patterns</option>
          <option value="malformed">Malformed or oversized</option>
          <option value="locked-feature">Locked features</option>
          <option value="rate-limit">Rate limits</option>
          <option value="ban">Bans</option>
        </select>
        <div class="seg" role="group" aria-label="Order"><button type="button" class="on" data-sort="newest">Newest</button><button type="button" data-sort="active">Most active</button></div>
        <a class="btn sm" id="csv" href="/api/owner/log.csv">Export CSV</a>
        <button class="btn sm ghost" id="refresh" type="button">Refresh</button>
      </div>
      <p class="err" id="err" role="alert"></p>
      <div id="groups"></div>
    </section>
  </main>
  <script src="/owner/owner.js"></script>
</body>
</html>
