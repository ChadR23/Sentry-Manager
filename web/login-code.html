<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Sign in: code</title>
<link rel="icon" href="/web/icon.png">
<style>
  :root{--bg:#0f1218;--card:#171b23;--fg:#e8ecf2;--muted:#9aa4b2;--line:#2a3140;--accent:#5ee9a0;--bad:#ff7b7b}
  @media (prefers-color-scheme: light){:root{--bg:#f4f5f7;--card:#fff;--fg:#14171c;--muted:#5b6472;--line:#d9dde3;--accent:#0f8a55;--bad:#c0392b}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px}
  h1{margin:0 0 6px;font-size:20px}
  p{margin:0 0 16px;color:var(--muted)}
  label{display:block;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font:600 22px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-align:center}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#06140d;font:700 15px/1 system-ui,sans-serif;cursor:pointer}
  button[disabled]{opacity:.6;cursor:default}
  .err{color:var(--bad);margin:12px 0 0;min-height:1.5em}
  .alt{display:block;margin-top:16px;text-align:center;color:var(--muted);font-size:13px}
  .alt a{color:inherit}
</style>
</head>
<body>
<main>
  <h1>Two-step sign-in</h1>
  <p>Enter the 6-digit code from your authenticator app. Lost the phone? Enter one of your recovery codes instead.</p>
  <form id="code-form" autocomplete="off">
    <label for="code">Code</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="11" required autofocus>
    <button type="submit">Sign in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <span class="alt"><a href="/login">Sign in again</a></span>
</main>
<script src="/web/login-code.js"></script>
</body>
</html>
