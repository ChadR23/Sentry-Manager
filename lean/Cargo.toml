[package]
name = "sentry-lean"
version = "0.1.0"
edition = "2021"
description = "Lean backend for Sentry Six Manager: the same API as the Node server, in one small binary"
license = "MIT"
publish = false

[[bin]]
name = "sentry-lean"
path = "src/main.rs"

[[bin]]
name = "sentry-lean-supervisor"
path = "src/supervisor/bin.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "macros", "signal", "sync", "time", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha1_smol = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
bytes = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
indexmap = { version = "2", features = ["serde"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
fancy-regex = "0.13"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
flate2 = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
