[package]
name = "sentry-lean"
version = "0.1.0"
edition = "2021"
description = "Lean backend for Sentry Six Manager: the same API as the Node server, in one small binary"
license = "MIT"
publish = false

[[bin]]
name = "sentry-lean"
path = "src/main.rs"

[[bin]]
name = "sentry-lean-supervisor"
path = "src/supervisor/bin.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "macros", "signal", "sync", "time", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha1_smol = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
bytes = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
indexmap = { version = "2", features = ["serde"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
fancy-regex = "0.13"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
aes-gcm = "0.10"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
flate2 = "1"
base64 = "0.22"
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
x509-parser = { version = "0.16", features = ["verify"] }
hmac = "0.12"
# core/: accounts, HTTPS, ACME, logs
scrypt = { version = "0.11", default-features = false }
sha1 = "0.10"
getrandom = "0.2"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2", "client-legacy"] }
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
regex = "1"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# time zones (vehicles.js validTimezone, policies.js dayInZone), the IANA data built in
# ui/: brotli for static files (flate2, regex, sha2 above serve it too)
brotli = { version = "7", default-features = false, features = ["std"] }
# CAN logs (src/can/; regex, flate2, sha2, p256, base64, indexmap above serve it too)
futures-core = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
