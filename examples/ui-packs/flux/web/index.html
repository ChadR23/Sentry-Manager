  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Main">
      <div class="side-head">
        <a class="brand" href="#/overview" aria-label="Flux home">
          <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a77bff"/><stop offset="1" stop-color="#5fd8ee"/></linearGradient></defs><rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="url(#lg2)" stroke-width="2.4"/><path d="M8 26 L14 18 L19 23 L25 12 L32 20" fill="none" stroke="url(#lg2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="brand-text"><b>FLUX</b><span>sentry six</span></span>
        </a>
        <button class="btn ghost icon side-close" id="side-close" type="button" aria-label="Close menu"><svg class="ico"><use href="#i-x"/></svg></button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <button class="btn ghost side-toggle" id="side-toggle" type="button" aria-label="Collapse sidebar" title="Collapse sidebar ( [ )"><svg class="ico"><use href="#i-sidebar"/></svg><span>Collapse</span></button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="main">
      <header class="top" id="top">
        <button class="btn ghost icon menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-controls="side" aria-expanded="false"><svg class="ico"><use href="#i-menu"/></svg></button>
        <div class="crumb" id="crumb"><span class="crumb-root">flux</span><span class="crumb-sep">/</span><b id="crumb-page">overview</b></div>
        <button class="cmdk" id="cmdk-btn" type="button" aria-label="Open command palette"><svg class="ico"><use href="#i-search"/></svg><span>Jump to…</span><kbd class="cmdk-kbd">Ctrl K</kbd></button>
        <div class="top-right">
          <label class="veh-pick" id="veh-pick-wrap"><svg class="ico" aria-hidden="true"><use href="#i-car"/></svg><span class="sr-only">Vehicle</span><select id="veh-pick" aria-label="Vehicle"></select><span class="veh-name" id="veh-name"></span></label>
          <span class="livedot" id="live" title="Live updates"><i></i><span>live</span></span>
          <a class="btn ghost icon bell" href="#/notifications" id="bell" aria-label="Notifications"><svg class="ico"><use href="#i-bell"/></svg><span class="badge" id="bell-badge" hidden></span></a>
          <button class="btn ghost icon" id="help-btn" type="button" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)"><svg class="ico"><use href="#i-keyboard"/></svg></button>
        </div>
      </header>
      <main class="page" id="page" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog class="dlg" id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
  <dialog class="palette" id="palette" aria-label="Command palette">
    <div class="pal-head"><svg class="ico"><use href="#i-search"/></svg><input id="pal-input" type="text" placeholder="Type a page, an action or a vehicle…" autocomplete="off" spellcheck="false" aria-label="Command" role="combobox" aria-expanded="true" aria-controls="pal-list"><kbd>Esc</kbd></div>
    <ul class="pal-list" id="pal-list" role="listbox"></ul>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> run</span><span><kbd>?</kbd> all shortcuts</span></div>
  </dialog>
</body>
</html>
