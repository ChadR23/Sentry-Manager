# Sentry Six Manager on TrueNAS SCALE 24.10 or newer (Apps run on Docker).
#
#   Apps > Discover Apps > (three dots, top right) > Install via YAML
#   Name: sentry-six-manager, paste this file, change the lines marked
#   CHANGE, then Save. Full steps: docs/truenas.md (or docs/USER-GUIDE.md).
#
# The web UI is then on https://<truenas>:9000. The setup code and the HTTPS
# fingerprint are in the app's logs (Apps > Installed > sentry-six-manager >
# Workloads > the log icon).
#
# Update (System > Shell, it asks for your password), then Stop and Start the app:
#   sudo docker pull ghcr.io/skittles-fivem/sentry-manager:latest
#
# OPTIONAL lines start with # in the first column. To turn one on, delete only
# that # (nothing else): the rest of the line is already lined up.

services:
  sentry-six-manager:
    image: ghcr.io/skittles-fivem/sentry-manager:latest
    container_name: sentry-six-manager
    restart: unless-stopped
    # time to stop cleanly mid-conversion
    stop_grace_period: 1m
    ports:
      # another app already on 9000 (MinIO uses it): change the left number
      - "9000:9000"
      # the device port: CAN Bridge uploads (closed until they are turned on;
      # Sentry USB needs no port: it is read from its share)
      - "10000:10000"
      # OPTIONAL: Let's Encrypt at a public domain (docs/security.md): a DNS
      # record to TrueNAS, ports 80 and 443 forwarded on the router, these two
      # lines, and TLS_ACME_DOMAIN below. TrueNAS's own web UI uses 80/443:
      # move it first (System > General > GUI).
#      - "80:9000"
#      - "443:9000"

    environment:
      TZ: America/Chicago
      # TrueNAS's "apps" user: it owns /data and must be able to write to
      # the footage dataset
      PUID: "568"
      PGID: "568"
      # OPTIONAL: the names / addresses you reach TrueNAS by, for the
      # certificate (more in Settings > Security)
#      TLS_HOSTNAMES: 192.168.1.20,truenas.local
      # OPTIONAL: Let's Encrypt (with the 80 and 443 lines above)
#      TLS_ACME_DOMAIN: example.com
#      TLS_ACME_EMAIL: you@example.com
      # OPTIONAL: create a first vehicle from the footage dataset below
#      VEHICLE_NAME: My Car
#      FOOTAGE_PATH: /footage/my-car

    volumes:
      # CHANGE: a dataset of its own for accounts, settings, journals,
      # thumbnails and converter staging (not inside the footage dataset)
      - /mnt/tank/apps/sentry-six-manager:/data

      # OPTIONAL, CHANGE: the dataset with the Tesla footage; then Settings >
      # Add vehicle > Folder in the container: /footage/my-car. More
      # vehicles: more lines like it. (Footage on another NAS: add it as an
      # SMB share in Settings instead.)
#      - /mnt/tank/TeslaCam:/footage/my-car

      # OPTIONAL: CPU watts and kWh (most Intel and AMD machines, not in a VM)
#      - /sys/devices/virtual/powercap:/host/powercap:ro

    # The root supervisor keeps only these; the web app and ffmpeg run as
    # PUID:PGID with none. Mounting SMB shares needs SYS_ADMIN,
    # DAC_READ_SEARCH and DAC_OVERRIDE; the rest start and stop the app.
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
      - CHOWN
      - KILL
    security_opt:
      - no-new-privileges:true
      # Docker's default AppArmor profile forbids mounting shares
      - apparmor:unconfined

    # OPTIONAL: AMD or Intel GPU
#    devices:
#      - /dev/dri:/dev/dri

    # OPTIONAL: NVIDIA GPU (first Apps > Configuration > Settings > Install
    # NVIDIA Drivers)
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [gpu]
