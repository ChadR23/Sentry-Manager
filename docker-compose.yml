# Sentry Six Manager: web UI on https://<docker-host>:9000
#
#   docker compose up -d
#   docker logs sentry-six-manager     (the setup code and the HTTPS fingerprint)
#
# Update:  docker compose pull && docker compose up -d
#
# Create the account with the setup code from the log, then add vehicles (one
# SMB share each) under Settings. Optional defaults go in .env (.env.example).
#
# OPTIONAL lines start with # in the first column. To turn one on, delete only
# that # (nothing else): the rest of the line is already lined up.

services:
  sentry-six-manager:
    # latest, or set SENTRY_TAG in .env to follow another image tag
    image: ghcr.io/skittles-fivem/sentry-manager:${SENTRY_TAG:-latest}
    container_name: sentry-six-manager
    restart: unless-stopped
    # time to stop cleanly mid-conversion (it carries on after an update)
    stop_grace_period: 1m
    ports:
      - "9000:9000"
      # OPTIONAL: Let's Encrypt at a public domain (docs/security.md): a DNS
      # A/AAAA record to this server, ports 80 and 443 forwarded on the
      # router, these two lines, and TLS_ACME_DOMAIN below
#      - "80:9000"
#      - "443:9000"
      # the device port: the Screenmate CAN Bridge's uploads and the Sentry USB
      # (the Pi in the car) management link; nothing listens until CAN uploads
      # are on or a Sentry USB is paired (keep it published: the Pi connects here)
      - "10000:10000"
    env_file:
      - path: .env
        required: false
    # OPTIONAL: Let's Encrypt (with the 80 and 443 lines above), or set them in .env
#    environment:
#      TLS_ACME_DOMAIN: example.com
#      TLS_ACME_EMAIL: you@example.com

    volumes:
      # accounts, settings, journals, thumbnails and converter staging
      # (keep it on a local disk, not on a share)
      - ./data:/data

      # OPTIONAL: CPU watts and kWh. Only if this folder exists on the server
      # (ls /sys/devices/virtual/powercap); otherwise Docker won't start.
#      - /sys/devices/virtual/powercap:/host/powercap:ro

    # The root supervisor keeps only these; the web app and ffmpeg run as
    # PUID:PGID with none. Mounting SMB shares needs SYS_ADMIN,
    # DAC_READ_SEARCH and DAC_OVERRIDE; the rest start and stop the app.
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
      - CHOWN
      - KILL
    security_opt:
      - no-new-privileges:true
      # Docker's default AppArmor profile forbids mounting shares
      - apparmor:unconfined
      # OPTIONAL: SELinux hosts (Fedora, RHEL)
#      - label=disable

    # OPTIONAL: Overview > Server shows the whole server, not only this
    # container. It can also see the server's processes: use it only with a
    # PUID/PGID of its own.
#    pid: host

    # OPTIONAL: AMD or Intel GPU (one or several; each gets its own row in
    # Encoder > Parallel conversions)
#    devices:
#      - /dev/dri:/dev/dri

    # OPTIONAL: NVIDIA GPU (needs the NVIDIA Container Toolkit on the server)
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [gpu]
