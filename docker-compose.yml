# Sentry Six Manager: web UI on https://<docker-host>:9000
#
#   docker compose up -d
#   docker logs sentry-six-manager     # the setup code and the HTTPS fingerprint
#
# Update:  docker compose pull && docker compose up -d
#
# Create the account with the setup code from the log, then add vehicles (one
# SMB share each) under Settings. Optional defaults go in .env (.env.example).
services:
  sentry-six-manager:
    # SENTRY_TAG picks what you follow: latest, or a branch's own image.
    # To use your own build instead, from a clone of the repository:
    #   docker build -t ghcr.io/skittles-fivem/sentry-manager:latest .
    image: ghcr.io/skittles-fivem/sentry-manager:${SENTRY_TAG:-latest}
    container_name: sentry-six-manager
    restart: unless-stopped
    # Room to stop cleanly when updating mid-conversion: the converter stops
    # ffmpeg and saves where it was, then carries on after the update.
    stop_grace_period: 1m
    ports:
      - "9000:9000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Accounts, settings, job journals, thumbnails, converter staging and
      # the default output folder. Keep it on local disk, not on a share.
      - ./data:/data
      # Optional, Overview > Server: CPU power in watts. Docker hides the
      # CPU's energy counters; this shows them, read-only, to the supervisor.
      # - /sys/devices/virtual/powercap:/host/powercap:ro
    # Only the small root supervisor keeps these; the web app and ffmpeg run
    # as PUID:PGID with no capabilities at all.
    #   SYS_ADMIN, DAC_READ_SEARCH, DAC_OVERRIDE  mount.cifs (SMB shares)
    #   SETUID, SETGID, SETPCAP                   start the app unprivileged
    #   CHOWN, KILL                               own /data, stop the app
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
      - CHOWN
      - KILL
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined      # Docker's default AppArmor profile forbids mount
      # - label=disable          # SELinux hosts (Fedora/RHEL)

    # ---- Optional, Overview > Server: the whole server (every process and
    # the host's network), not only this container. It also lets this
    # container see and signal the server's processes: use it only with a
    # PUID/PGID of its own (not your login user or another container's).
    # pid: host

    # ---- AMD (dGPU or APU) / Intel GPU: uncomment
    # devices:
    #   - /dev/dri:/dev/dri
    # The converter uses /dev/dri/renderD128. With several GPUs, map the one
    # you want to that name instead, e.g. - /dev/dri/renderD129:/dev/dri/renderD128

    # ---- NVIDIA GPU (needs the NVIDIA Container Toolkit): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
